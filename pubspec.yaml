name: prepx_pro
description: Free Interview Preparation App using GetX

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTML rendering for problem descriptions
  flutter_html: ^3.0.0-beta.2

  # For code editor line numbers & scroll sync
  linked_scroll_controller: ^0.2.0

  # GetX Ecosystem (FREE)
  get: ^4.6.6
  get_storage: ^2.1.1

  # Firebase Spark Plan (FREE FOREVER)
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0

  # AI - Gemini Free Tier
  google_generative_ai: ^0.4.7

  # Voice - Speech to Text and Text to Speech
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  audioplayers: ^6.0.0

  # HTTP Client (FREE)
  dio: ^5.4.0

  # File Picker & PDF Parsing
  file_picker: ^8.0.0+1
  pdfx: ^2.5.0
  syncfusion_flutter_pdf: ^26.1.35

  # Charts
  syncfusion_flutter_charts: ^26.1.35

  # UI & Utilities (FREE)
  cupertino_icons: ^1.0.6
  shimmer: ^3.0.0
  intl: ^0.19.0
  flutter_animate: ^4.5.0

  # Notifications (FREE - Local)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
